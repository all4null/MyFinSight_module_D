[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myfinsight"
version = "0.1.0"
description = "MyFinSight 프로토타입 (LLM 없는 고정 Profile·Spec → Backtest → Report)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "pandas>=2.1,<3",
    "numpy>=1.26,<2.1",
    "SQLAlchemy>=2.0,<2.1",
    "yfinance",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
myfinsight = "myfinsight.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = ["UP042", "D100", "D104", "D105", "D107", "D203", "D213", "D400", "D415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
